name: offline-replay

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify public release
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tools:tests
        run: python tools/verify_public_release.py
      - name: Run portable regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tools:tests
        run: >-
          python -m unittest -v
          test_m1_fixture_identity
          test_m1_shacl
          test_m1_owl_reasoning
          test_m1_semantic_acceptance
          test_development_corpus
          test_development_characterisation
          test_development_retrieval
          test_m5_openai_adapter
          test_m5_evidence_answers
          test_m5_corrected_retrieval
          test_m7_challenge_freeze
          test_m7_protocol_checks
          test_m7_owner_metrics
          test_m7_results_replay
